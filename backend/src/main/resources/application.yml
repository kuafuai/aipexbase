server:
  port: ${PORT:8080}

# MyBatis配置
mybatis:
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/*.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

app:
  # 文件路径 示例（ Windows配置D:/kuafu/uploadPath，Linux配置 /home/kuafu/uploadPath）
  profile: ${UPLOAD_PATH:../uploadPath}
  version: ${VERSION:1.0.0}
  channel: ${CHANNEL:source}

knife4j:
  enable: true

# MCP服务器配置
mcp:
  server:
    name: ${MCP_SERVER_NAME:baas-mcp-server}
    version: ${MCP_SERVER_VERSION:1.0.0}
    message-endpoint: ${MCP_MESSAGE_ENDPOINT:/mcp/message}
    sse-endpoint: ${MCP_SSE_ENDPOINT:/mcp/sse}

# API文档解析服务配置
api:
  document:
    parser:
      url: ${API_DOCUMENT_PARSER_URL:http://124.71.176.202:6680/v1/chat-messages}
      api-key: ${API_DOCUMENT_PARSER_API_KEY:app-ty6qpAKP8fsSOyfD0K7lYdTo}
      # 用于测试后分析的API配置
      analysis_url: ${API_DOCUMENT_ANALYSIS_URL:http://124.71.176.202:6680/v1/chat-messages}
      analysis_api_key: ${API_DOCUMENT_ANALYSIS_API_KEY:app-8noHD9vy2OgCdUZ5A0MGlQ2p}

# 语音网关（透传到 ByteDance 火山 ASR/TTS）
# 客户端连 wss://<host>/voice/asr/** 或 /voice/tts/**，X-Api-Key 里传 aipexbase 签发的 kft_xxx；
# 网关校验 token 后把 X-Api-Key 换成下面的 api-key 转发给火山。
voice:
  huoshan:
    api-key: ${HUOSHAN_API_KEY:xx}
    asr-base: ${HUOSHAN_ASR_BASE:wss://openspeech.bytedance.com/api/v3/sauc}
    tts-base: ${HUOSHAN_TTS_BASE:wss://openspeech.bytedance.com/api/v3/tts}
    allowed-asr-resources:
      - volc.bigasr.sauc.duration
      - volc.seedasr.sauc.duration
    allowed-tts-resources:
      - seed-tts-2.0
      - seed-icl-2.0
  # LLM 网关：POST /voice/llm/chat/completions
  # 客户端在 Authorization: Bearer kft_xxx 里传 aipexbase 签发的 token；
  # 网关校验后把 Authorization 换成下面的 api-key 转发到 base-url。
  llm:
    base-url: ${LLM_BASE_URL:https://api.deepseek.com}
    api-key: ${LLM_API_KEY:xx}
    # 空数组表示不限制模型。建议至少列白名单，防止 token 越权调贵模型。
    allowed-models: []

#mysql
spring:
  profiles:
    active: ${DB_TYPE:mysql}
  jackson:
    date-format: "yyyy-MM-dd HH:mm:ss"
    time-zone: GMT+8
  servlet:
    multipart:
      max-request-size: 100MB
      max-file-size: 50MB
      enabled: true
  web:
    resources:
      static-locations: file:${FRONTEND_DIR:/data/frontend/test/} , classpath:/dist/

# 在控制台输出sql
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    call-setters-on-nulls: true

logging:
  level:
    org:
      springframework:
        boot:
          autoconfigure:
            logging: info
        security: ${LOG_LEVEL:info}
    com:
      kuafuai:
        common: ${LOG_LEVEL:info}
        config: ${LOG_LEVEL:info}
        dynamic: ${LOG_LEVEL:info}
        system: ${LOG_LEVEL:info}
        manage:
          mcp: ${LOG_LEVEL:info}

huawei:
  key-id: ${HW_KEY_ID:37b6a1fac5d648afa0003f2234c0118b}
  private-key: ${HW_PRIVATE_KEY:xxx}
  account-id: ${HW_ACCOUNT_ID:xxx}

token:
  expireTime: 43200

cache:
  #缓存可选择redis还是local
  type: ${CACHE_TYPE:local}


message:
  enable: ${MESSAGE_ENABLE:false}
  notifyUrl: ${MESSAGE_BASE_URL:xxx}
  notifyUrl2: ${MESSAGE_BASE_URL2:xxx}

deploy:
  workspaceDir: ${DEPLOY_WORKSPACE_DIR:/data/codeflying/kuafu-runtime-agent/workspace}
  baseUrl: ${DEPLOY_BASE_URL:http://124.71.176.202}
  maxFileSize: ${DEPLOY_MAX_FILE_SIZE:100}
  cacheExpireTime: ${DEPLOY_CACHE_EXPIRE_TIME:3}


storage:
  type: ${STORAGE_TYPE:local}
  s3:
    access_key: ${S3_ACCESS_KEY:access_key}
    secret_key: ${S3_SECRET_KEY:secret_key}
    endpoint: ${S3_ENDPOINT:endpoint}
    domain: ${S3_DOMAIN:domain}
    region: ${S3_REGION:cn-east-3}
    bucket_name: ${S3_BUCKET_NAME:aipexbase}

delayTaskWorkerName: ${HOSTNAME:worker_name}

sensitive:
  enable: ${SENSITIVE_ENABLE:false}
  app_key: ${AK:x}
  secret_key: ${SK:x}


error-report:
  reportUrl: ${ERROR_REPORT_URL:xxxxxxxxxxxxx}
  secretKey: ${ERROR_REPORT_SECRET_KEY:xxxxxxxxxx}

# 对外管理API配置
manage:
  api:
    enable: ${MANAGE_API_ENABLE:true}
    token: ${MANAGE_API_TOKEN:kf_TLYflZqeCBQvhXmOAlVyeEZyfKEXQfwwnUAuyMZTT6r}